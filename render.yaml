services:
  - type: web
    name: nimbo-erp
    env: node
    region: ohio
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://nimbo-erp.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://postgres.zwkdshnezjipugrhktjq:fd31a6eb4ffa7b1011c3ca37eb04db42@aws-0-ca-central-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PORT
        value: 10000
    disk:
      name: nimbo-db-data
      mountPath: /app/db-data
      sizeGB: 1